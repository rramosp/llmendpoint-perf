dataset:
  generation_prompt: "visual questions about some sports retail product catalog images with 30 to 300 input tokens and between 1 and 3 images each prompt, generating ~120 output tokens."
  num_items: 100
  generation_model_endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
  generation_model: "gemini-3.8-flash"
  # Optional dataset generation settings:
  api_key_env: "OPENAI_API_KEY"
  num_threads: 5
  temperature: 1.0
  multimodal:
    enabled: true
    image_source: "google_search"
    image_width: 512
    image_height: 512
    image_format: "jpeg"

evaluation:
  model_endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
  model: "gemini-3.5-flash-lite"
  num_threads: 10
  wait_time_between_requests_ms: 20
  run_time_secs: 300
  # Optional evaluation settings:
  api_key_env: "OPENAI_API_KEY"
  thinking_effort: null
  max_requests: null
  warmup_requests: 0
  request_timeout_secs: 120
  sampling_strategy: "round_robin"
  generation_params:
    temperature: 0.7
    max_tokens: 256
  pricing:
    input_per_1m_tokens: 1.25
    output_per_1m_tokens: 10.00
    cached_input_per_1m_tokens: 0.3125
  slo:
    max_ttft_ms: 1500
    max_tpot_ms: 50
    max_e2e_ms: 6000
