[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmendpoint-perf"
version = "0.3.0"
description = "Technical and cost performance measurement framework for OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "google-cloud-storage>=2.10.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
llmendpoint-perf = "llmendpoint_perf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmendpoint_perf*"]
